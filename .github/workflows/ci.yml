name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, windows-11-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.os == 'windows-11-arm' }}
    steps:
      - uses: actions/checkout@v4
      - name: Checkout sibling path dependency (RS-JSON)
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE"
          [ -d ../RS-JSON ] || git clone --depth=1 https://github.com/aon-co-jp/RS-JSON.git ../RS-JSON
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --locked
