[package]
name = "vps-tidy"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
authors = ["石 塚 正 浩（MASAHIRO ISHIZUKA）"]
license = "MIT OR Apache-2.0"
description = "VPSの無駄なデータ(古いバイナリの控え・古いログ・キャッシュ・cargoのビルドの中間生成物)を、固定の規則だけで、安全に定期整理する。既定は試し実行。"
readme = "README.md"

[dependencies]
serde = { version = "1", features = ["derive"] }
toml = "0.8"
glob = "0.3"
anyhow = "1"

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
